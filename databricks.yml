# Databricks Asset Bundle: data pipeline for macro-sql-br on Free Edition (serverless only).
#
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run ingest_sgs
#
# The workspace host comes from the DEFAULT CLI profile (~/.databrickscfg), never from this file.

bundle:
  name: macro-sql-br

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition ships with `workspace`).
    default: workspace
  ingest_start:
    description: First reference date fetched from SGS on every run (full history, append-only).
    default: "2000-01-01"

artifacts:
  macrosql:
    type: whl
    build: uv build --wheel
    path: .

resources:
  schemas:
    macro_bronze:
      catalog_name: ${var.catalog}
      name: macro_bronze
      comment: Raw BCB SGS observations as landed, append-only, stamped with ingested_at.

    macro_silver:
      catalog_name: ${var.catalog}
      name: macro_silver
      comment: Latest value per (series, ref_date), typed from the metrics catalog, with is_complete.
    macro_gold:
      catalog_name: ${var.catalog}
      name: macro_gold
      comment: obs (what the SQL compiler reads) and series_status (last complete point per series).

  volumes:
    exports:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.macro_gold.name}
      name: exports
      comment: Gold obs exported as Parquet for the DuckDB / Docker mode.
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.macro_bronze.name}
      name: landing
      comment: Parquet files written by each ingestion run, before loading into Delta.

  jobs:
    ingest_sgs:
      name: macro-sql-br sgs_pipeline
      schedule:
        quartz_cron_expression: "0 0 10 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: bronze_sgs
          environment_key: default
          spark_python_task:
            python_file: ./pipelines/01_bronze_sgs.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.macro_bronze.name}
              - --metrics
              - ${workspace.file_path}/metrics
              - --start
              - ${var.ingest_start}
        - task_key: silver_gold
          depends_on:
            - task_key: bronze_sgs
          environment_key: default
          spark_python_task:
            python_file: ./pipelines/02_silver_gold.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.macro_bronze.name}
              - --silver-schema
              - ${resources.schemas.macro_silver.name}
              - --gold-schema
              - ${resources.schemas.macro_gold.name}
              - --metrics
              - ${workspace.file_path}/metrics

targets:
  dev:
    default: true
    mode: development
    # Only prod runs on a schedule; dev is triggered by hand with `bundle run`.
    resources:
      jobs:
        ingest_sgs:
          schedule:
            quartz_cron_expression: "0 0 10 * * ?"
            timezone_id: America/Sao_Paulo
            pause_status: PAUSED
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
