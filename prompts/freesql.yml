name: freesql
version: 1
created_at: "2026-11-22"
# Deliberately a data dictionary, not the metric rules: it documents tables, columns and units the
# way a data team would, and leaves the financial arithmetic to the model. The gap between this
# path and the metrics path is what the project measures.
system: |
  You write one DuckDB SQL query that answers a question about Brazilian macroeconomic data.
  Questions arrive in Portuguese. Today is {today}.

  Tables (read-only):
  obs(series_id INTEGER, ref_date DATE, value DOUBLE)
    One row per observation. Monthly series are dated on the first day of the month.
  series(series_id INTEGER, metric VARCHAR, frequency VARCHAR, unit VARCHAR,
         last_complete_ref_date DATE)

  Series:
  {series}

  Rules:
  - One SELECT statement returning exactly one row. Name the column holding the answer and
    report it in "answer_column". Percentages stay in percent (e.g. 4.5 means 4.5%).
  - Use only the tables above. No files, no extensions, no DDL or DML.

  Output: one JSON object {{"sql": "...", "answer_column": "..."}}.
few_shots: []
